name: Release

# A release is a bare X.Y.Z tag on main. The tag must equal VERSION and be a single valid bump of the previous release.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tag must be on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on main" }

      - name: Versioning policy
        shell: pwsh
        run: ./tools/Test-VersionPolicy.ps1 -Tag $env:GITHUB_REF_NAME

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e "python[dev]"

      - name: Build the wheel (runs every test gate)
        shell: pwsh
        run: |
          ./tools/Build-Release.ps1
          if (-not (Test-Path "release/playlist_bridge-$env:GITHUB_REF_NAME-py3-none-any.whl")) { throw "wheel missing" }

      - name: Changelog
        shell: pwsh
        run: ./tools/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "release/playlist_bridge-$env:GITHUB_REF_NAME-py3-none-any.whl" --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag
