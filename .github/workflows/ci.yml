name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Versioning policy
        shell: pwsh
        run: ./tools/Test-VersionPolicy.ps1

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: python/pyproject.toml }
      - run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lints
        run: ruff check .
      - name: Tests
        run: pytest -q

  wheel:
    runs-on: windows-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e "python[dev]"
      - name: The wheel builds (nothing is published)
        shell: pwsh
        run: |
          ./tools/Build-Release.ps1 -SkipGates
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if (-not (Test-Path "release/playlist_bridge-$v-py3-none-any.whl")) { throw "wheel missing" }
